<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Milli Mücadele Tekrarı</title>
<meta name="theme-color" content="#b3121c" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#6a0d14" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Milli Mücadele">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE everyday study tool for a 17-year-old: one obvious next step, no fuss
   IDEA a 1919–22 field telegraph pad; every question arrives as a numbered dispatch slip
   PICTURE the start panel: today's question count drawn large with one Başla button
   COLOUR flag crimson band, white paper, near-black ink; olive for right, crimson for wrong, khaki between
   TYPE Barlow Condensed 700 + Source Sans 3
   LAYOUT slim crimson band, then start panel, then two tiles, then topic chips; phone keeps the same order */
:root{color-scheme:light;--bg:#fff;--ink:#17131a;--soft:#5d5359;--line:#e4dcdc;--panel:#fff;--tint:#f6f1ef;--red:#b3121c;--btn:#b3121c;--band:#b3121c;--bandSoft:#ffdcd8;--ok:#3c6a1c;--okBg:#e9f2df;--badBg:#fbe6e5;--khaki:#a88d4a;--l0:#ddd5d5;--focus:#1f4fd1;--terrain:#e8e0cf;--terrainHi:#dcd1ba}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#141113;--ink:#f3ede9;--soft:#b8adb0;--line:#352d30;--panel:#1c181a;--tint:#231d20;--red:#ff6d64;--btn:#c42a2a;--band:#6a0d14;--bandSoft:#f4bcb7;--ok:#9ccc6a;--okBg:#1f2b16;--badBg:#3a171b;--khaki:#cdb173;--l0:#41383b;--focus:#8fb0ff;--terrain:#3b3431;--terrainHi:#4b423e}}
:root[data-theme=dark]{color-scheme:dark;--bg:#141113;--ink:#f3ede9;--soft:#b8adb0;--line:#352d30;--panel:#1c181a;--tint:#231d20;--red:#ff6d64;--btn:#c42a2a;--band:#6a0d14;--bandSoft:#f4bcb7;--ok:#9ccc6a;--okBg:#1f2b16;--badBg:#3a171b;--khaki:#cdb173;--l0:#41383b;--focus:#8fb0ff;--terrain:#3b3431;--terrainHi:#4b423e}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.5 "Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:hidden;-webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,4vw);padding-right:max(16px,4vw)}
h1,h2,h3{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;line-height:1.05;letter-spacing:-.01em;margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.hero{background:var(--band);color:#fff;padding:20px 0 18px}
.hrow{display:flex;justify-content:space-between;align-items:flex-end;gap:12px 20px;flex-wrap:wrap}
.hero h1{font-size:clamp(40px,10vw,58px)}
.brand{display:flex;align-items:center;gap:14px}
.ay{display:block;flex:none;width:clamp(52px,13vw,74px);height:auto;fill:#fff}
.sub{margin:4px 0 0;color:var(--bandSoft);font-size:16px}
.stats{display:flex;gap:22px}
.stats b{display:block;font:700 30px/1 "Barlow Condensed","Arial Narrow",sans-serif;white-space:nowrap}
.stats small{font-size:17px;font-weight:600;color:var(--bandSoft)}
.stats span{font-size:14px;color:var(--bandSoft)}
main{padding-top:18px;padding-bottom:36px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.intro{background:var(--tint);border:1.5px solid var(--ink)}
.intro h2{font-size:26px}
.intro ol{margin:10px 0 0;padding-left:22px}
.intro li{margin-bottom:6px}
.intro li::marker{font-weight:700;color:var(--red)}
.start{border:1.5px solid var(--ink);box-shadow:5px 5px 0 var(--red)}
.review{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 18px;align-items:center}
.big{font:700 clamp(64px,16vw,92px)/.9 "Barlow Condensed","Arial Narrow",sans-serif;color:var(--red)}
.review h2{font-size:30px}
.review p{margin:4px 0 0;color:var(--soft)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;border-radius:10px;border:0;background:var(--btn);color:#fff;font-weight:700;font-size:17px}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.wide{width:100%;min-height:58px;font-size:20px;margin-top:16px}
.bar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--l0);margin:18px 0 8px}
.bar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:14px;color:var(--soft)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
.note{font-size:14px;color:var(--soft);margin:12px 0 0}
.note.ok{color:var(--ok);font-weight:600}
.sec{margin:26px 0 6px;font-size:28px}
.lead{margin:0 0 12px;color:var(--soft)}
.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.chip,.tile{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1.5px solid var(--line);background:var(--panel)}
.chip{min-height:64px;padding:12px 14px;border-radius:12px}
.chip b{font-size:17px;line-height:1.2}
.chip span,.tile p{font-size:14px;color:var(--soft);margin:0}
.chip:hover,.tile:hover{border-color:var(--red)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{padding:16px;border-radius:14px;min-height:112px}
.tile h3{font-size:25px;margin-bottom:4px;overflow-wrap:anywhere}
.tile .cnt{color:var(--red);font-weight:700}
footer{margin-top:30px;padding-top:14px;border-top:1px solid var(--line);font-size:14px;color:var(--soft)}
.topbar{position:sticky;top:0;z-index:5;background:var(--band);color:#fff}
.topbar .wrap{display:flex;align-items:center;gap:12px;min-height:56px}
.back{background:transparent;border:0;color:#fff;font-weight:600;min-height:44px;padding:0 6px 0 0;white-space:nowrap}
.topbar .t{flex:1;font:700 21px/1.1 "Barlow Condensed","Arial Narrow",sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .n{font-weight:600;white-space:nowrap}
.prog{height:4px;background:rgba(255,255,255,.25)}
.prog i{display:block;height:100%;background:#fff;transition:width .3s}
.slip{margin-top:20px;border:1.5px solid var(--ink);border-radius:4px;background:var(--panel);box-shadow:5px 5px 0 var(--red)}
.slip header{display:flex;justify-content:space-between;flex-wrap:wrap;gap:2px 10px;padding:8px 14px;border-bottom:1.5px dashed var(--ink);font-size:14px;font-weight:600}
.slip .q{padding:18px 14px 20px;font-size:clamp(20px,5.2vw,24px);font-weight:600;line-height:1.35}
.slip .q.pq{font:700 clamp(30px,8vw,38px)/1.05 "Barlow Condensed","Arial Narrow",sans-serif}
.ask{margin:22px 0 0;font-weight:700}
.opts{display:grid;gap:10px;margin-top:10px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;min-height:52px;padding:10px 16px;border-radius:10px;border:1.5px solid var(--line);background:var(--panel);font-size:17px;font-weight:600;color:var(--ink)}
.opt:not(:disabled):hover{border-color:var(--ink)}
.opt:disabled{cursor:default;opacity:1}
.opt.ok{border-color:var(--ok);background:var(--okBg)}
.opt.bad{border-color:var(--red);background:var(--badBg)}
.opt small{flex:none;font-size:13px;font-weight:700}
.opt.ok small{color:var(--ok)}
.opt.bad small{color:var(--red)}
.opt .od{display:block;font-size:15px;font-weight:600;color:var(--soft)}
.pair .opt{min-height:76px;font-size:20px}
.vs{text-align:center;font-size:14px;color:var(--soft);margin:-2px 0}
.compass{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-areas:"w c e" ". s .";gap:10px;margin-top:10px}
.compass .opt{flex-direction:column;justify-content:center;text-align:center;min-height:76px;padding:10px 8px}
.compass .c{grid-area:c;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;color:var(--soft)}
.compass .c::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--red);margin-bottom:4px}
.fb{margin-top:16px;padding:14px 16px;border-radius:10px;background:var(--tint)}
.fb b{display:block;font-size:18px}
.fb.ok b{color:var(--ok)}
.fb.bad b{color:var(--red)}
.fb p{margin:4px 0 0}
.fb .again{font-size:14px;color:var(--soft)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.phase{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:0 12px;margin:28px 0 4px}
.phase h2{font-size:28px}
.phase span{color:var(--soft);font-size:15px;font-weight:600}
.placed{list-style:none;margin:10px 0 0 7px;padding:0 0 0 20px;border-left:2px solid var(--red)}
.placed li{position:relative;padding:4px 0 14px}
.placed li::before{content:"";position:absolute;left:-28px;top:9px;width:14px;height:14px;border-radius:50%;background:var(--red);border:3px solid var(--bg)}
.placed .when{font-size:14px;color:var(--soft);font-weight:600}
.placed b{display:block;font-size:18px;line-height:1.25}
.placed .nt{display:block;font-size:15px;color:var(--soft)}
.rows{list-style:none;margin:0;padding:0}
.rows li{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.rows .c{flex:none;font-weight:700;color:var(--red);white-space:nowrap}
.rows.qa li{display:block}
.rows.qa b{display:block;color:var(--ok)}
.empty{color:var(--soft);margin:0}
.link{background:none;border:0;padding:10px 0;color:var(--soft);text-decoration:underline;min-height:44px}
textarea{width:100%;min-height:170px;font:15px/1.4 "Source Sans 3",system-ui,sans-serif;padding:10px;border:1.5px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
.mh{display:flex;justify-content:space-between;align-items:baseline;gap:2px 12px;flex-wrap:wrap}
.mh h2{font-size:28px}
.mh span{color:var(--soft);font-size:15px;font-weight:600}
.mapbox{margin:10px 0 0}
.tr{display:block;width:100%;height:auto;overflow:visible}
.tr .base{fill:var(--terrain);stroke:var(--panel);stroke-width:3;stroke-linejoin:round}
.tr .fill{fill:var(--red);pointer-events:none;transition:fill-opacity .8s}
.tr .rg{cursor:pointer}
.tr .rg:hover .base{fill:var(--terrainHi)}
.tr .rg.hl .base{stroke:var(--ink);stroke-width:6}
.tr .hat{fill:url(#hatch);stroke:var(--panel);stroke-width:3}
.tr .hb{fill:var(--terrain)}
.tr .hx{stroke:var(--soft);stroke-width:3;opacity:.45}
.tr .star{fill:var(--ink)}
.tr .lb{font-family:"Source Sans 3",system-ui,sans-serif;font-size:var(--fs,41px);font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--panel);stroke-width:.24em;stroke-linejoin:round;pointer-events:none}
.tr .lb.lib .pc{fill:#fff;stroke:var(--btn)}
.tr .lb.sm{font-size:calc(var(--fs,41px)*.8);font-weight:600;fill:var(--soft)}
.tr.narrow .nm{display:none}
.today{margin-top:12px;padding-top:14px;border-top:1.5px dashed var(--line)}
.dl b{display:block;font:700 26px/1.1 "Barlow Condensed","Arial Narrow",sans-serif}
.dl span{color:var(--soft)}
.regs{display:grid;gap:8px}
.rrow{display:grid;grid-template-columns:minmax(0,1fr) 64px 4.4em;align-items:center;gap:12px;text-align:left;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--panel);min-height:62px}
.rrow:hover{border-color:var(--red)}
.rrow b{display:block;font-size:17px;line-height:1.2}
.rrow small{display:block;font-size:14px;color:var(--soft);line-height:1.3}
.rbar{height:8px;border-radius:4px;background:var(--l0);overflow:hidden}
.rbar i{display:block;height:100%;background:var(--red)}
.rp{text-align:right;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.rrow.lib{border-color:var(--red)}
.rrow.lib .rp{color:var(--red)}
.cel{background:var(--band);color:#fff;border-radius:14px;padding:18px;margin-bottom:14px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 16px;align-items:center}
.cel .st{width:68px;animation:pop .7s ease-out}
.cel h2{font-size:30px}
.cel p{margin:6px 0 0;color:var(--bandSoft)}
@keyframes pop{0%{transform:scale(.2) rotate(-40deg);opacity:0}70%{transform:scale(1.25)}100%{transform:scale(1)}}
details.topics{margin-top:24px;border-top:1px solid var(--line)}
details.topics summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:56px;font:700 26px/1.1 "Barlow Condensed","Arial Narrow",sans-serif}
details.topics summary::-webkit-details-marker{display:none}
details.topics summary::after{content:"+";font-size:30px;color:var(--red)}
details.topics[open] summary::after{content:"–"}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:420px){.stats{gap:16px}.compass .opt{font-size:15px}.tile{padding:14px}.tile h3{font-size:22px}}
</style>
</head>
<body>
<div id="view"></div>
<script>
{
const MONTHS=["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
const pd=s=>{const p=s.split("-").map(Number);return new Date(p[0],p[1]-1,p[2])};
const esc=s=>String(s).replace(/[&<>"]/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const x=a[i];a[i]=a[j];a[j]=x}return a};
const $=s=>document.querySelector(s);
/* ay yıldız: Türk Bayrağı Tüzüğü oranlarıyla */
const AY=c=>`<svg class="ay ${c||""}" viewBox="-26.0 -26 69.2 52" aria-hidden="true"><path d="M21.125 -13.369A25 25 0 1 0 21.125 13.369A20 20 0 1 1 21.125 -13.369Z"/><path d="M19.583 0.000L28.221 -2.806L28.221 -11.888L33.559 -4.541L42.196 -7.347L36.858 -0.000L42.196 7.347L33.559 4.541L28.221 11.888L28.221 2.806Z"/></svg>`;

const G={
kongre:{n:"Genelgeler ve kongreler",o:["Havza Genelgesi","Amasya Genelgesi","Erzurum Kongresi","Sivas Kongresi","Amasya Görüşmeleri","Misak-ı Millî"]},
antlasma:{n:"Antlaşmalar",o:["Mondros Ateşkesi","Sevr Antlaşması","Gümrü Antlaşması","Moskova Antlaşması","Kars Antlaşması","Ankara Antlaşması","Mudanya Ateşkesi","Lozan Antlaşması"]},
muharebe:{n:"Muharebeler",o:["I. İnönü Muharebesi","II. İnönü Muharebesi","Kütahya-Eskişehir Muharebeleri","Sakarya Meydan Muharebesi","Büyük Taarruz"]},
meclis:{n:"TBMM kararları",o:["Hıyanet-i Vataniye Kanunu","İstiklal Mahkemeleri","Teşkilât-ı Esasiye","Başkomutanlık Kanunu","Tekâlif-i Millîye","Saltanatın kaldırılması"]},
cemiyet:{n:"Cemiyetler",o:["Wilson Prensipleri Cemiyeti","İngiliz Muhipleri Cemiyeti","Trakya-Paşaeli Cemiyeti","Kilikyalılar Cemiyeti","Millî Kongre Cemiyeti","Redd-i İlhak Cemiyeti","Mavri Mira","Pontus Rum Cemiyeti","Taşnak ve Hınçak","Kürt Teali Cemiyeti"]},
cephe:{n:"Cepheler",o:["Batı Cephesi","Doğu Cephesi","Güney Cephesi"]}
};

const C=[
["k1","kongre","Havza Genelgesi","İşgallerin mitinglerle protesto edilmesi, İtilaf temsilcilerine protesto telgrafları çekilmesi istendi.","28 Mayıs 1919. Halkı millî bilince uyandırmaya yönelik ilk adım."],
["k2","kongre","Havza Genelgesi","Protesto mitinglerinde Hristiyan halka zarar verilmemesi istendi.","Amaç, İtilaf Devletlerine yeni işgaller için bahane vermemekti."],
["k3","kongre","Amasya Genelgesi","“Milletin istiklalini yine milletin azim ve kararı kurtaracaktır” denildi.","Kurtuluş Savaşı'nın amacı (bağımsızlık) ve yöntemi (millet eliyle) ilk kez açıkça yazıldı; millî egemenliğe vurgu var."],
["k4","kongre","Amasya Genelgesi","İstanbul Hükûmeti'nin sorumluluğunu yerine getiremediği açıkça belirtildi.","Bu yüzden ihtilal niteliği taşıyan ilk belge sayılır."],
["k5","kongre","Amasya Genelgesi","Sivas'ta ulusal bir kongre toplanması kararlaştırıldı.","Kararı Amasya verdi, kongre Sivas'ta toplandı. Soru “kararlaştırıldı” diyorsa Amasya."],
["k6","kongre","Amasya Genelgesi","Milletin sesini duyurmak için her türlü etki ve denetimden uzak bir kurul oluşturulması gerektiği belirtildi.","Fikir Amasya'da doğdu; Temsil Heyeti ilk kez Erzurum'da kuruldu."],
["k7","kongre","Erzurum Kongresi","Manda ve himaye ilk kez reddedildi.","Sivas'ta manda yeniden tartışıldı ve reddi kesinleşti. “İlk kez” görürsen Erzurum."],
["k8","kongre","Erzurum Kongresi","Millî sınırlar içinde vatanın bir bütün olduğu, parçalanamayacağı ilk kez belirtildi.","Millî sınır kavramı Erzurum'da doğdu, Misak-ı Millî'de netleşti."],
["k9","kongre","Erzurum Kongresi","Temsil Heyeti ilk kez oluşturuldu ve başına Mustafa Kemal getirildi.","Erzurum'da 9 kişilik heyet seçildi; Sivas'ta genişletildi."],
["k10","kongre","Erzurum Kongresi","Toplanış biçimi bölgesel, aldığı kararlar ulusal niteliktedir.","Delegeler doğu illerinden geldi ama kararlar bütün vatanı kapsadı."],
["k11","kongre","Sivas Kongresi","Bütün yararlı cemiyetler Anadolu ve Rumeli Müdafaa-i Hukuk Cemiyeti adı altında birleştirildi.","Kuvâ-yı Milliye tek merkezden yönetilir hale geldi."],
["k12","kongre","Sivas Kongresi","Hem toplanış biçimi hem de aldığı kararlar bakımından ulusal bir kongredir.","Erzurum'dan farkı: delegeler yurdun her yerinden geldi."],
["k13","kongre","Sivas Kongresi","Temsil Heyeti genişletilerek bütün yurdu temsil eder hale getirildi.","Heyet Erzurum'da kurulmuştu, burada yetkisi bütün yurda yayıldı."],
["k14","kongre","Sivas Kongresi","Görüşleri duyurmak için İrade-i Milliye gazetesi çıkarıldı.","Hâkimiyet-i Milliye ise Ocak 1920'de Ankara'da çıktı; ikisini karıştırma."],
["k15","kongre","Sivas Kongresi","Ali Fuat Paşa, Batı Anadolu Kuvâ-yı Milliye Komutanlığı'na getirildi.","Batı'daki dağınık direnişi tek komutaya bağlamak için."],
["k16","kongre","Amasya Görüşmeleri","Temsil Heyeti, İstanbul Hükûmeti tarafından hukuken tanınmış oldu.","Ali Rıza Paşa hükümeti adına Salih Paşa ile görüşüldü."],
["k17","kongre","Amasya Görüşmeleri","Mebusan Meclisi'nin İstanbul dışında güvenli bir yerde toplanması istendi ama kabul edilmedi.","Meclis İstanbul'da toplandı, Misak-ı Millî'yi kabul etti ve sonra dağıtıldı."],
["k18","kongre","Misak-ı Millî","Son Osmanlı Mebusan Meclisi tarafından kabul edildi.","28 Ocak 1920. Kurtuluş Savaşı'nın hedeflerini ve sınırlarını belirleyen belge."],
["k19","kongre","Misak-ı Millî","Kars, Ardahan, Batum ve Batı Trakya'nın geleceğinin halkoylamasıyla belirlenmesi istendi.","Halkoylaması isteği Misak-ı Millî sorularının en sevilen ayrıntısıdır."],

function grade(c,ok,picked){
 const t=today();active();
 let r=st.cards[c.id];
 if(!r){r=st.cards[c.id]={b:0,d:t,w:0,r:0};if(st.newDay!==t){st.newDay=t;st.newCount=0}st.newCount++}
 if(ok){r.r++;r.lw=0;if(r.d<=t){r.b=Math.min(5,r.b+1);r.d=t+IV[r.b]}}
 else{r.w++;r.b=1;r.d=t+1;r.lw=1;
  if(isP(c)){const k=c.e1+"|"+c.e2;st.tconf[k]=(st.tconf[k]||0)+1}

 save();
}
const unseen=f=>C.filter(c=>!rec(c.id)&&f(c));
function newBatch(n){
 const pairs=shuf(unseen(isP)),facts=shuf(unseen(c=>!isP(c)));
 let np=Math.min(n>=8?3:n>=4?2:1,pairs.length,n),nf=Math.min(n-np,facts.length);np=Math.min(pairs.length,n-nf);
 return pairs.slice(0,np).concat(facts.slice(0,nf)).map(c=>c.id);
}

 return {due,fresh,ids:shuf(due.concat(fresh))};
}

function makeOpts(c){
 if(isP(c))return shuf([c.e1,c.e2]);

}

const topT=()=>Object.entries(st.tconf).filter(([k])=>k.split("|").every(id=>TB[id])).sort((a,b)=>b[1]-a[1]).slice(0,8);
function summary(){
 const d=new Date(),n=counts(),L=[`Milli Mücadele tekrar özeti (${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()})`,`Kalıcı ${n[3]}, pekişiyor ${n[2]}, öğreniliyor ${n[1]}, yeni ${n[0]} (toplam ${C.length} soru). Seri: ${streak()} gün.`,`Kurtuluş haritası: ${RO.map(k=>`${REG[k].s} ${pct(regProg()[k])}${st.lib[k]?" (kurtarıldı)":""}`).join(", ")}`];
 const cf=topConf(),tc=topT(),hd=hardIds().slice(0,6);
 if(cf.length){L.push("","Karıştırdığım ikililer:");cf.forEach(([k,v])=>{const p=k.split("→");L.push(`- ${p[1]} yerine ${p[0]} dedim (${v} kez)`)})}
 if(tc.length){L.push("","Sırasını karıştırdıklarım:");tc.forEach(([k,v])=>{const p=k.split("|");L.push(`- Önce ${TB[p[0]].name}, sonra ${TB[p[1]].name} (${v} kez)`)})}
 if(hd.length){L.push("","En çok yanlış yaptığım sorular:");hd.forEach(id=>L.push(`- ${cardQ(BY[id])} → ${cardA(BY[id])} (${rec(id).w} yanlış)`))}
 if(!cf.length&&!tc.length)L.push("","Henüz kayıtlı karışıklık yok.");
 return L.join("\n");
}
function renderMix(){
 const cf=topConf(),tc=topT(),hd=hardIds().slice(0,6);
 view.innerHTML=bar("Karıştırdıkların","",null)+`<main class="wrap">
 <section class="panel" style="margin-top:6px"><h2 style="font-size:26px">Genel durum</h2>${levelBar(counts())}</section>
 <h2 class="sec">Birbirine karıştırdıkların</h2>
 ${cf.length?`<ul class="rows">${cf.map(([k,v])=>{const p=k.split("→");return `<li><span><b>${esc(p[1])}</b> yerine <b>${esc(p[0])}</b> dedin</span><span class="c">${v}×</span></li>`}).join("")}</ul>`:`<p class="empty">Henüz yok. Birkaç gün çalışınca burada birikecek.</p>`}
 <h2 class="sec">Sırasını karıştırdıkların</h2>
 ${tc.length?`<ul class="rows">${tc.map(([k,v])=>{const p=k.split("|");return `<li><span>Önce <b>${esc(TB[p[0]].name)}</b>, sonra <b>${esc(TB[p[1]].name)}</b></span><span class="c">${v}×</span></li>`}).join("")}</ul>`:`<p class="empty">“Hangisi önce oldu?” sorularında yanıldıkça burada görünecek.</p>`}
 <h2 class="sec">En çok zorlandığın sorular</h2>
 ${hd.length?`<ul class="rows qa">${hd.map(id=>`<li><span>${esc(cardQ(BY[id]))}</span><b>${esc(cardA(BY[id]))}</b></li>`).join("")}</ul>`:`<p class="empty">Henüz yanlış yaptığın soru yok.</p>`}
 <div class="actions">${hd.length?`<button class="btn" data-act="hard">Zorlandıklarımı çalış</button>`:""}<button class="btn ghost" data-act="copy">Hocana göndermek için kopyala</button></div>
 <div id="copyOut"></div>
 ${R?`<div class="panel" style="margin-top:20px"><b>Tüm ilerleme silinsin mi?</b><p class="note">Sorular, seri ve karışıklık kayıtları sıfırlanır.</p><div class="actions"><button class="btn" data-act="resetyes">Evet, sıfırla</button><button class="btn ghost" data-act="resetno">Vazgeç</button></div></div>`:`<button class="link" data-act="reset">İlerlemeyi sıfırla</button>`}
 </main>`;
}
function copySummary(){
 const txt=summary(),out=$("#copyOut");
 const show=()=>{out.innerHTML=`<p class="note">Otomatik kopyalanamadı. Metni seçip kopyala:</p><textarea id="sumText" readonly>${esc(txt)}</textarea>`;const ta=$("#sumText");ta.focus();ta.select()};
 try{navigator.clipboard.writeText(txt).then(()=>{out.innerHTML=`<p class="note ok">Kopyalandı. WhatsApp'tan hocana yapıştırabilirsin.</p>`},show)}catch(e){show()}
}

/* ---------- olaylar ---------- */
/* telefonun geri tuşu: her ekran #adres ile tarayıcı geçmişine yazılır */
let stack=[""],internal=false;
function nav(h){if("#"+h===location.hash)return;stack.push(h);internal=true;location.hash=h}
function navReplace(h){stack[stack.length-1]=h;if("#"+h===location.hash)return;internal=true;location.replace("#"+h)}
function route(h){window.scrollTo(0,0);if(h==="kronoloji")return renderKrono();if(h==="karistirdiklarin")return renderMix();if(h==="soru"&&S&&S.i<S.q.length)return renderQuiz();if(h==="sonuc"&&S&&S.i>=S.q.length)return renderEnd();renderHome()}
function goHome(){const n=stack.length-1;if(n>0)history.go(-n);else{renderHome();window.scrollTo(0,0)}}
const go=goHome;
window.addEventListener("hashchange",()=>{
 const h=location.hash.slice(1);
 if(internal){internal=false;return}
 const i=stack.lastIndexOf(h);
 if(i>=0)stack=stack.slice(0,i+1);else stack.push(h);
 route(h);
});
document.addEventListener("click",ev=>{
 const b=ev.target.closest("[data-act]");if(!b)return;const a=b.dataset.act;
 if(a==="home")return go();
 if(a==="introok"){st.intro=1;save();return renderHome()}
 if(a==="daily")return startQuiz("Bugünün çalışması",dailyIds(),dailyIds,true);
 if(a==="extra")return startQuiz("Ekstra tur",extraIds(),extraIds);
 if(a==="set"){const g=b.dataset.g,f=()=>pickSet(g);return startQuiz(g==="mix"?"Karışık":G[g].n,f(),f)}
 if(a==="opt")return answer(+b.dataset.i);
 if(a==="next")return nextQ();
 if(a==="again"){const ids=S.again();return ids.length?startQuiz(S.title,ids,S.again):go()}
 if(a==="reg"){const r=b.dataset.r,f=()=>regionIds(r);return startQuiz(REG[r].n,f(),f)}
 if(a==="krono"){renderKrono();window.scrollTo(0,0);return nav("kronoloji")}
 if(a==="mix"){R=false;renderMix();window.scrollTo(0,0);return nav("karistirdiklarin")}
 if(a==="hard")return startQuiz("Zorlandıkların",hardIds(),hardIds);
 if(a==="copy")return copySummary();
 if(a==="reset"){R=true;return renderMix()}
 if(a==="resetno"){R=false;return renderMix()}
 if(a==="resetyes"){st=freshState();st.intro=1;save();R=false;return go()}
});

const hot=window.claude&&window.claude.hot;
if(hot&&typeof hot.snapshot==="function")hot.snapshot(()=>st);
const boot=d=>{if(d&&d.cards)st=Object.assign(freshState(),d);if(location.hash&&location.hash!=="#"){internal=true;location.replace("#")}renderHome()};
if(hot&&typeof hot.ready==="function")hot.ready(boot);else boot(hot&&hot.data||{});
}
</script>
